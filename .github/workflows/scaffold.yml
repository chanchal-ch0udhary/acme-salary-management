# One-time helper: generates the Rails API skeleton on Linux and commits it.
# (Rails could not be run on the author's Windows PC, so GitHub's servers do `rails new`.)
name: Generate Rails skeleton
on: workflow_dispatch

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: rails new
        run: |
          gem install rails --no-document
          rails -v
          rails new . --force --api --database=sqlite3 --skip-git --skip-test --skip-ci --skip-docker \
            --skip-kamal --skip-thruster --skip-solid --skip-rubocop --skip-brakeman \
            --skip-action-mailer --skip-action-mailbox --skip-action-text --skip-active-storage \
            --skip-action-cable --skip-jbuilder --skip-bundle
          bundle add rspec-rails factory_bot_rails --group "development,test"
          bundle add csv
          bin/rails generate rspec:install
      - name: Commit skeleton
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: generate Rails API skeleton with rails new (+ rspec-rails, factory_bot_rails)"
          git push
