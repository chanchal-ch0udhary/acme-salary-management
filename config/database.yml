# SQLite (the brief suggests a relational DB like SQLite).
#
# DB_DIR lets you keep the database files somewhere else. Normally you do not need it.
# (On WSL, keep the project inside the Linux home folder, e.g. ~/acme-salary-management,
#  because SQLite does not work well on /mnt/c.)
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch("DB_DIR", "storage") %>/development.sqlite3

# The test database is erased and re-created by the specs. Never point it at development/production.
test:
  <<: *default
  database: <%= ENV.fetch("DB_DIR", "storage") %>/test.sqlite3

production:
  <<: *default
  database: <%= ENV.fetch("DB_DIR", "storage") %>/production.sqlite3
